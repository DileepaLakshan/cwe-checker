<script type="module">
  // ----- Mock API for demonstration (replace with real window.scannerAPI) -----

          },

  // ----- UI Logic -----
  const scanBtn = document.getElementById('scanBtn');
  const welcomeScreen = document.getElementById('welcome-screen');
  const resultsPanel = document.getElementById('results-panel');
  const resultsContent = document.getElementById('results-content');
  const tabSast = document.getElementById('tab-sast');
  const tabSca = document.getElementById('tab-sca');
  const backBtn = document.getElementById('backToWelcomeBtn');
  const statusFolderPath = document.getElementById('status-folder-path');
  const workspaceName = document.getElementById('workspace-name');
  const workspaceHeader = document.getElementById('workspace-header');
  const noFolderState = document.getElementById('no-folder-state');
  const sidebarOpenBtn = document.getElementById('btn-open-folder-side');
  const welcomeOpenFolder = document.getElementById('welcome-open-folder');

  let currentResults = { sast: [], sca: [] };
  let activeResultTab = 'sast'; // 'sast' or 'sca'

  // Helper to switch between welcome and results view
  function showWelcome() {
    welcomeScreen.style.display = 'flex';
    resultsPanel.style.display = 'none';
  }

  function showResults() {
    welcomeScreen.style.display = 'none';
    resultsPanel.style.display = 'block';
  }

  // Render results based on active tab
  function renderResults() {
    const data = activeResultTab === 'sast' ? currentResults.sast : currentResults.sca;
    if (!data || data.length === 0) {
      resultsContent.innerHTML = `<div class="empty-results">No findings detected. Great job! ✅</div>`;
      return;
    }

    let html = '';
    if (activeResultTab === 'sast') {
      data.forEach((finding) => {
        html += `
          <div class="result-card">
            <div class="result-title">
              <span>${finding.ruleId || 'Rule'}</span>
              <span class="badge ${finding.severity?.toLowerCase()}">${finding.severity || 'INFO'}</span>
            </div>
            <div style="margin: 6px 0;">${finding.message || 'No description'}</div>
            <div class="file-path">📄 ${finding.file || 'unknown'}:${finding.line || ''}</div>
            <code style="font-size:12px; color:#a6adc8;">${finding.code || ''}</code>
          </div>
        `;
      });
    } else {
      data.forEach((vuln) => {
        html += `
          <div class="result-card">
            <div class="result-title">
              <span>${vuln.package || 'package'}@${vuln.version || '?'}</span>
              <span class="badge ${vuln.severity?.toLowerCase()}">${vuln.severity || 'INFO'}</span>

            <div><strong>${vuln.vulnerability || 'CVE'}</strong>: ${vuln.title || 'Vulnerability'}</div>
            <div style="margin-top:6px;">🔧 Fix: ${vuln.fixedVersion ? 'Upgrade to ' + vuln.fixedVersion : 'N/A'}</div>
          </div>
        `;
      });
    }
    resultsContent.innerHTML = html;
  }

  // Switch tabs

  // Main scan action
function collectCweIds(metadata = {}, fallbackId = '') {
  const ids = new Set();
  const values = [metadata.cwe, metadata.cwe_id, metadata.cwe_ids, metadata.CWE, metadata.CweID, fallbackId];

  const visit = (value) => {
    if (!value) return;
    if (Array.isArray(value)) {
      value.forEach(visit);
      return;
    }
    if (typeof value === 'object') {
      Object.values(value).forEach(visit);
      return;
    }

    const matches = String(value).match(/CWE[-_:\s]*\d+/gi) || [];
    matches.forEach(match => {
      const number = match.replace(/\D/g, '');
      if (number) ids.add(`CWE-${number}`);
    });
  };

  values.forEach(visit);
  return [...ids];
}
  // 1. Your main scan runner
async function performScan() {
  try {
    const projectFolder = await window.scannerAPI.selectProject();
    if (!projectFolder) return;

    console.log(`Starting scans on: ${projectFolder}...`);

    const [sastResults, scaResults] = await Promise.all([
      window.scannerAPI.runSAST(projectFolder),
      window.scannerAPI.runSCA(projectFolder)
    ]);

    console.log("SAST Results:", sastResults);
    console.log("SCA Results:", scaResults);

    // FIX: Safely extract the ARRAYS before sending them to be rendered
    const sastIssuesArray = sastResults?.results || [];
    const sastCweIssuesArray = sastIssuesArray.flatMap(hit => {
      const cweIds = collectCweIds(hit.extra?.metadata, hit.check_id);
      const idsToShow = cweIds.length > 0 ? cweIds : ['CWE not mapped'];
      return idsToShow.map(cweId => ({ ...hit, CweID: cweId }));
    });
    
    // Trivy groups things by file, so extract vulnerabilities and expand their CWE mappings.
    let trivyVulnerabilities = [];
    if (scaResults?.Results && Array.isArray(scaResults.Results)) {
      scaResults.Results.forEach(target => {
        if (target.Vulnerabilities) {
          trivyVulnerabilities = trivyVulnerabilities.concat(target.Vulnerabilities);
        }
      });
    }

    const cweIssuesArray = trivyVulnerabilities.flatMap(vuln => {
      const cweIds = Array.isArray(vuln.CweIDs) ? vuln.CweIDs.filter(Boolean) : [];
      return cweIds.map(cweId => ({ ...vuln, CweID: cweId }));
    });

    // Now call your UI render functions with true arrays!
    renderSASTResults(sastCweIssuesArray);
    renderSCAResults(cweIssuesArray, trivyVulnerabilities.length);

    // Update your summary counts
    document.getElementById('results-summary').innerHTML = `
      <span class="badge">OpenGrep CWE Findings: ${sastCweIssuesArray.length}</span>
      <span class="badge">Trivy CWE Issues: ${cweIssuesArray.length}</span>
    `;

    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('scan-results-panel').style.display = 'block';

  } catch (error) {
    console.error("Scanning failed:", error);
  }
}

// 2. Updated clean rendering function for SAST
function renderSASTResults(cweIssues) {
  const container = document.getElementById('sast-results-container');
  
  if (cweIssues.length === 0) {
    container.innerHTML = '<div class="no-issues">No source code CWE findings found!</div>';
    return;
  }

  container.innerHTML = cweIssues.map(hit => `
    <div class="result-card sast-card">
      <div class="card-header">
        <span class="severity warning">Warning</span>
        <span class="vuln-id">${hit.CweID}</span>
      </div>
      <p class="file-path">File: ${hit.path} (Line: ${hit.start?.line || 'unknown'})</p>
      <p class="vuln-desc"><b>Reason:</b> ${hit.extra?.message || 'No reason provided by the OpenGrep rule.'}</p>
      <p class="vuln-desc"><b>Rule:</b> ${hit.check_id}</p>
    </div>
  `).join('');
}

// 3. Updated clean rendering function for SCA
function renderSCAResults(cweIssues, totalVulnerabilities = 0) {
  const container = document.getElementById('sca-results-container');

  if (cweIssues.length === 0) {
    container.innerHTML = `<div class="no-issues">${
      totalVulnerabilities === 0
        ? 'No dependency CWE issues found!'
        : `Trivy found ${totalVulnerabilities} dependency vulnerabilities, but no CWE mappings were included.`
    }</div>`;
    return;
  }

  container.innerHTML = cweIssues.map(vuln => `
    <div class="result-card sca-card">
      <div class="card-header">
        <span class="severity ${vuln.Severity ? vuln.Severity.toLowerCase() : 'low'}">${vuln.Severity || 'UNKNOWN'}</span>
        <span class="vuln-id">${vuln.CweID}</span>
      </div>
      <p class="file-path">Package: <b>${vuln.PkgName}</b> (Installed: ${vuln.InstalledVersion})</p>
      <p class="vuln-desc">${vuln.Title || vuln.Description || 'No description available.'}</p>
    </div>
  `).join('');
}

  // Event listeners for scan buttons and folder openers
  scanBtn.addEventListener('click', performScan);

  // Sidebar open folder button
  sidebarOpenBtn?.addEventListener('click', async () => {
    const folder = await window.scannerAPI.selectProject();
    if (folder) updateWorkspacePath(folder);
  });

  welcomeOpenFolder?.addEventListener('click', async () => {
    const folder = await window.scannerAPI.selectProject();
    if (folder) updateWorkspacePath(folder);
  });

  // Initial state
  showWelcome();
</script>

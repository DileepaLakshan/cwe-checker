<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CWE-Checker Editor | Scan Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-container">
    <!-- Activity Bar Component -->
    <div id="activity-bar"></div>

    <!-- Sidebar Component -->
    <div id="sidebar-component"></div>

    <!-- Editor Area -->
    <div class="editor-area">
      <!-- Tabs Bar Component -->
      <div id="tabs-bar-component"></div>
      
      <!-- Editor Container -->
      <div class="editor-container" id="editor-container">
        <div id="dynamic-view">
          <!-- Welcome Screen Component -->
          <div id="welcome-screen-component"></div>
          
          <!-- Scan Results Panel Component -->
          <div id="scan-results-component"></div>
          
          <!-- ML Results Panel Component -->
          <div id="ml-results-component" style="display: none;"></div>
          
          <!-- Results Panel Component (Legacy) -->
          <div id="results-panel-legacy" style="display: none;"></div>
        </div>

        <div class="code-editor-panel" id="code-editor-panel" style="display: none;">
          <div class="breadcrumbs" id="editor-breadcrumbs"></div>
          <div class="editor-workspace">
            <div class="line-numbers-container">
              <pre class="line-numbers" id="line-numbers"></pre>
            </div>
            <textarea id="code-textarea" class="code-textarea" spellcheck="false" aria-label="Code editor"></textarea>
          </div>
        </div>
      </div>
      
      <!-- Status Bar Component -->
      <div id="status-bar-component"></div>
    </div>
  </div>

  <script type="module" src="./src/renderer.js"></script>
</body>
</html>
